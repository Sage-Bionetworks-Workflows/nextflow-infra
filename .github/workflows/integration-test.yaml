name: integration-test
on:
  workflow_call:
    secrets:
      tower-token:
        description: Seqera Platform (Tower) access token with permission to launch pipelines in the target workspace
        required: true
    inputs:
      job-environment:
        required: true
        type: string
      tower-url:
        description: Base URL of the Seqera Platform (Tower) instance (without a trailing /api)
        required: true
        type: string
      workspace:
        description: Target workspace as OrganizationName/WorkspaceName (or a numeric workspace ID)
        required: true
        type: string
      compute-env:
        description: Name of the compute environment in the workspace to launch nf-canary on
        required: true
        type: string
      work-dir:
        description: S3 work directory for the pipeline run
        required: true
        type: string
      pipeline-url:
        description: Git URL of the nf-canary pipeline to launch
        required: false
        type: string
        default: https://github.com/seqeralabs/nf-canary
      revision:
        description: Git revision (branch or tag) of the pipeline to launch
        required: false
        type: string
        default: main

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{ inputs.job-environment }}
    permissions:
      contents: read
    steps:
      - name: Install tw CLI
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fsSL https://github.com/seqeralabs/tower-cli/releases/latest/download/tw-linux-x86_64 -o tw
          chmod +x tw
          sudo mv tw /usr/local/bin/tw
          tw --version
      - name: Launch nf-canary and wait for success
        run: >
          tw launch "$PIPELINE_URL"
          --workspace "$WORKSPACE"
          --compute-env "$COMPUTE_ENV"
          --work-dir "$WORK_DIR"
          --revision "$REVISION"
          --wait SUCCEEDED
        env:
          TOWER_ACCESS_TOKEN: ${{ secrets.tower-token }}
          TOWER_API_ENDPOINT: ${{ inputs.tower-url }}/api
          PIPELINE_URL: ${{ inputs.pipeline-url }}
          WORKSPACE: ${{ inputs.workspace }}
          COMPUTE_ENV: ${{ inputs.compute-env }}
          WORK_DIR: ${{ inputs.work-dir }}
          REVISION: ${{ inputs.revision }}
