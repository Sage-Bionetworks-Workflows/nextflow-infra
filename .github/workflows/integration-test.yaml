name: integration-test
on:
  workflow_call:
    inputs:
      aws-role-to-assume:
        required: true
        type: string
      aws-assume-role-duration:
        required: false
        type: number
        default: 3600
      dataset_id:
        required: true
        type: string
      s3_prefix:
        required: true
        type: string
      synapse_token:
        required: true
        type: string

jobs:
  deployment-validation:
    runs-on: ubuntu-latest
    environment: ${{ inputs.job-environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5
      - name: Set up python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python dependencies
        run: pip install --dev --categories "py-orca"
      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          role-session-name: GHA-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}
          role-duration-seconds: ${{ inputs.aws-assume-role-duration }}
      - name: Checkout py-orca repository
        uses: actions/checkout@v5
        with:
          repository: Sage-Bionetworks-Workflows/py-orca
          path: ./py-orca
      - name: Install py-orca dependencies
        run: pipenv install --dev --categories "py-orca"
      - name: run py-orca demo.py
        run: python demo.py run --dataset_id ${{inputs.dataset_id}} --s3_prefix ${{inputs.s3_prefix}}
        working-directory: ./py-orca
        env:
          # The URI must be in format syn://:<token>@
          # Uses the Synapse orca-service user account's nextflow-infra-py-orca-test token
          SYNAPSE_CONNECTION_URI: ${{ secrets.SYNAPSE_CONNECTION_URI }}
